name: Maugham
options:
  bundleIdPrefix: com.maugham
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
packages:
  MaughamCore:
    path: Packages/MaughamCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
targets:
  Maugham:
    type: application
    platform: macOS
    sources:
      - path: Maugham
        excludes:
          - Info.plist
          - "**/AREA.md"
          - "Resources/PublishStarter/**"
          - "Resources/bin/**"
      - path: Maugham/Resources/PublishStarter
        type: folder
      - path: Maugham/Resources/bin
        type: folder
    info:
      path: Maugham/Info.plist
      properties:
        CFBundleDisplayName: $(MAUGHAM_DISPLAY_NAME)
        CFBundleName: $(MAUGHAM_DISPLAY_NAME)
        CFBundleShortVersionString: "0.0.0-dev"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: YES
        NSSupportsSuddenTermination: NO
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.maugham.Maugham.dev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MAUGHAM_DEV_BUILD
          MAUGHAM_DISPLAY_NAME: Maugham Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.maugham.Maugham
          MAUGHAM_DISPLAY_NAME: Maugham
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    resources:
      - path: Maugham/Resources
        includes:
          - "*.md"
    dependencies:
      - package: MaughamCore
      - package: WhisperKit
      - target: maugham-mcp
        copy:
          destination: executables
          codeSign: false
    postBuildScripts:
      - name: Stamp Debug build identity (git SHA)
        basedOnDependencyAnalysis: false
        script: |
          # Debug only: stamp CFBundleVersion with the git short SHA (+ -dirty)
          # so list_maugham_tools can report the exact commit a dev build came
          # from — 0.0.0-dev can't distinguish builds. Release builds get
          # CFBundleVersion from CI (github.run_number); leave those untouched.
          # Never touches CFBundleShortVersionString (that stays tag/CI-derived).
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          SHA=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null) || exit 0
          if ! git -C "$SRCROOT" diff --quiet 2>/dev/null \
             || ! git -C "$SRCROOT" diff --cached --quiet 2>/dev/null; then
            SHA="${SHA}-dirty"
          fi
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          [ -f "$PLIST" ] || exit 0
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $SHA" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $SHA" "$PLIST"
          echo "Stamped CFBundleVersion=$SHA"
  maugham-mcp:
    type: tool
    platform: macOS
    sources:
      - path: maugham-mcp
    settings:
      base:
        PRODUCT_NAME: maugham-mcp
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  MaughamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaughamTests
    resources:
      - path: MaughamTests/Fixtures
    dependencies:
      - target: Maugham
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Maugham.app/Contents/MacOS/Maugham
        GENERATE_INFOPLIST_FILE: YES
  MaughamPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MaughamPhone
        excludes:
          - Info.plist
          - "**/AREA.md"
    info:
      path: MaughamPhone/Info.plist
      properties:
        CFBundleDisplayName: $(MAUGHAM_DISPLAY_NAME)
        CFBundleShortVersionString: "0.0.0-dev"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSMicrophoneUsageDescription: "Maugham records voice notes so you can capture ideas out loud; they sync to your project's inbox."
        NSSpeechRecognitionUsageDescription: "Maugham transcribes your voice notes on-device so you can confirm what you said before it syncs."
        NSCameraUsageDescription: "Maugham captures photo references — whiteboards, book pages, locations — straight into your project's inbox."
        NSPhotoLibraryUsageDescription: "Maugham attaches photos from your library as reference captures in your project's inbox."
        NSFaceIDUsageDescription: "Maugham uses Face ID to protect annotation review when you enable it in Settings."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Pre-answers the App Store Connect export-compliance question so TestFlight
        # uploads don't stall. The app uses only standard HTTPS / iCloud /
        # LocalAuthentication — all exempt. (See docs/release-notes/phone/SETUP.md.)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # iPhone-only (TARGETED_DEVICE_FAMILY=1). The app is a portrait-only iPhone
        # companion; the default (1,2 = iPhone+iPad) would require ALL FOUR
        # orientations for iPad multitasking, which App Store Connect enforces at
        # upload — it rejected the first dry run for declaring portrait-only on an
        # iPad-capable bundle. iPhone-only keeps portrait-only valid.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.Maugham.MaughamPhone.dev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MAUGHAM_DEV_BUILD
          MAUGHAM_DISPLAY_NAME: Maugham Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          # NB: capital "M" in "Maugham" — the registered Apple App ID is
          # com.Maugham.MaughamPhone (Apple namespaces App IDs case-insensitively,
          # so the lowercase form can't be re-registered). Diverges intentionally
          # from the Mac's com.maugham.Maugham. See CLAUDE.md → phone bundle-id note.
          PRODUCT_BUNDLE_IDENTIFIER: com.Maugham.MaughamPhone
          MAUGHAM_DISPLAY_NAME: Maugham
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MaughamCore
  MaughamPhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MaughamPhoneTests
    dependencies:
      - target: MaughamPhone
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MaughamPhone.app/MaughamPhone
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Maugham:
    build:
      targets:
        Maugham: all
        maugham-mcp: all
        MaughamTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaughamTests
  MaughamPhone:
    build:
      targets:
        MaughamPhone: all
        MaughamPhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaughamPhoneTests
