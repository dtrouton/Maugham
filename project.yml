name: Maugham
options:
  bundleIdPrefix: com.maugham
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Maugham:
    type: application
    platform: macOS
    sources:
      - path: Maugham
        excludes:
          - Info.plist
    info:
      path: Maugham/Info.plist
      properties:
        CFBundleDisplayName: Maugham
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: YES
        NSSupportsSuddenTermination: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maugham.Maugham
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    resources:
      - path: Maugham/Resources
        includes:
          - "*.md"
    dependencies:
      - target: maugham-mcp
        copy:
          destination: executables
          codeSign: false
  maugham-mcp:
    type: tool
    platform: macOS
    sources:
      - path: maugham-mcp
    settings:
      base:
        PRODUCT_NAME: maugham-mcp
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  MaughamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaughamTests
    resources:
      - path: MaughamTests/Fixtures
    dependencies:
      - target: Maugham
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Maugham.app/Contents/MacOS/Maugham
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Maugham:
    build:
      targets:
        Maugham: all
        maugham-mcp: all
        MaughamTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaughamTests
