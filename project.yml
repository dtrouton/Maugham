name: Maugham
options:
  bundleIdPrefix: com.maugham
  deploymentTarget:
    # macOS 26. Raised from 14.0 on 2026-08-04: the binder's segmented picker
    # lays out differently below 26 (it FILLS its container instead of hugging
    # its content, so a one-segment Review/Publish picker stretched the whole
    # 240pt column and read as a header rather than a control — the exact
    # "broken chrome" BinderSegmentPickerMountTests exists to catch). The floor
    # was never deliberately 14; it was the default nobody revisited, and CI
    # was the only place the app ever ran on an older OS.
    macOS: "26.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
packages:
  MaughamCore:
    path: Packages/MaughamCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    # Pinned to an immutable commit (not a floating `from:` range) so release
    # builds are reproducible and can't auto-pull a moved/compromised in-range
    # tag. Bump by resolving the new tag to its SHA (git ls-remote --tags).
    # Dependabot can't watch this — it's an xcodegen dep, not a Package.swift.
    revision: defefaefe33dc6dbb45005958abaea1c0f8293ff # v0.9.4
targets:
  Maugham:
    type: application
    platform: macOS
    sources:
      - path: Maugham
        excludes:
          - Info.plist
          - Maugham.entitlements
          - "**/AREA.md"
          - "Resources/PublishStarter/**"
          - "Resources/bin/**"
          - "Resources/Samples/**"
      - path: Maugham/Resources/PublishStarter
        type: folder
      - path: Maugham/Resources/bin
        type: folder
      - path: docs/guide
        type: folder
      - path: docs/skills
        type: folder
      - path: Maugham/Resources/Samples
        type: folder
    info:
      path: Maugham/Info.plist
      properties:
        CFBundleDisplayName: $(MAUGHAM_DISPLAY_NAME)
        CFBundleName: $(MAUGHAM_DISPLAY_NAME)
        CFBundleShortVersionString: "0.0.0-dev"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: YES
        NSSupportsSuddenTermination: NO
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.maugham.Maugham.dev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MAUGHAM_DEV_BUILD
          MAUGHAM_DISPLAY_NAME: Maugham Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          ENABLE_HARDENED_RUNTIME: NO
          CODE_SIGN_IDENTITY: "-"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.maugham.Maugham
          MAUGHAM_DISPLAY_NAME: Maugham
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_ENTITLEMENTS: Maugham/Maugham.entitlements
    resources:
      - path: Maugham/Resources
        includes:
          - "*.md"
    dependencies:
      - package: MaughamCore
      - package: WhisperKit
      - target: maugham-mcp
        copy:
          destination: executables
          codeSign: true
    postBuildScripts:
      - name: Stamp Debug build identity (git SHA)
        basedOnDependencyAnalysis: false
        script: |
          # Debug only: stamp CFBundleVersion with the git short SHA (+ -dirty)
          # so list_maugham_tools can report the exact commit a dev build came
          # from — 0.0.0-dev can't distinguish builds. Release builds get
          # CFBundleVersion from CI (github.run_number); leave those untouched.
          # Never touches CFBundleShortVersionString (that stays tag/CI-derived).
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          SHA=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null) || exit 0
          if ! git -C "$SRCROOT" diff --quiet 2>/dev/null \
             || ! git -C "$SRCROOT" diff --cached --quiet 2>/dev/null; then
            SHA="${SHA}-dirty"
          fi
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          [ -f "$PLIST" ] || exit 0
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $SHA" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $SHA" "$PLIST"
          echo "Stamped CFBundleVersion=$SHA"
  maugham-mcp:
    type: tool
    platform: macOS
    sources:
      - path: maugham-mcp
    settings:
      base:
        PRODUCT_NAME: maugham-mcp
        # Ships inside the app bundle, so it can never run anywhere the app
        # cannot — one floor, matching `settings.base`.
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  MaughamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaughamTests
    resources:
      - path: MaughamTests/Fixtures
    dependencies:
      - target: Maugham
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Maugham.app/Contents/MacOS/Maugham
        GENERATE_INFOPLIST_FILE: YES
  MaughamPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MaughamPhone
        excludes:
          - Info.plist
          - "**/AREA.md"
    info:
      path: MaughamPhone/Info.plist
      properties:
        CFBundleDisplayName: $(MAUGHAM_DISPLAY_NAME)
        CFBundleShortVersionString: "0.0.0-dev"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSMicrophoneUsageDescription: "Maugham records voice notes so you can capture ideas out loud; they sync to your project's inbox."
        NSSpeechRecognitionUsageDescription: "Maugham transcribes your voice notes on-device so you can confirm what you said before it syncs."
        NSCameraUsageDescription: "Maugham captures photo references — whiteboards, book pages, locations — straight into your project's inbox."
        NSPhotoLibraryUsageDescription: "Maugham attaches photos from your library as reference captures in your project's inbox."
        NSFaceIDUsageDescription: "Maugham uses Face ID to protect annotation review when you enable it in Settings."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Pre-answers the App Store Connect export-compliance question so TestFlight
        # uploads don't stall. The app uses only standard HTTPS / iCloud /
        # LocalAuthentication — all exempt. (See docs/release-notes/phone/SETUP.md.)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # iPhone-only (TARGETED_DEVICE_FAMILY=1). The app is a portrait-only iPhone
        # companion; the default (1,2 = iPhone+iPad) would require ALL FOUR
        # orientations for iPad multitasking, which App Store Connect enforces at
        # upload — it rejected the first dry run for declaring portrait-only on an
        # iPad-capable bundle. iPhone-only keeps portrait-only valid.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.Maugham.MaughamPhone.dev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MAUGHAM_DEV_BUILD
          MAUGHAM_DISPLAY_NAME: Maugham Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          # NB: capital "M" in "Maugham" — the registered Apple App ID is
          # com.Maugham.MaughamPhone (Apple namespaces App IDs case-insensitively,
          # so the lowercase form can't be re-registered). Diverges intentionally
          # from the Mac's com.maugham.Maugham. See CLAUDE.md → phone bundle-id note.
          PRODUCT_BUNDLE_IDENTIFIER: com.Maugham.MaughamPhone
          MAUGHAM_DISPLAY_NAME: Maugham
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MaughamCore
  MaughamPhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MaughamPhoneTests
    dependencies:
      - target: MaughamPhone
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MaughamPhone.app/MaughamPhone
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Maugham:
    build:
      targets:
        Maugham: all
        maugham-mcp: all
        MaughamTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # THE TEST HOST MUST NOT RESTORE WINDOWS. Two reasons, one of them a
      # gate-killer (root-caused 2026-08-15, `lldb` on
      # `-[NSAnimation startAnimation]`):
      #
      # 1. Every launch went through
      #    `-[NSApplication _reopenWindowsAsNecessaryIncludingRestorableState:]`
      #    -> `_autoreopenDocuments...` -> SwiftUI's
      #    `AppWindowsController.showInitialWindows()` -> `makeKeyAndOrderFront:`,
      #    and AppKit answers each of those with a `_NSWindowTransformAnimation`
      #    that runs BLOCKING on a dispatch worker thread. In a test host the
      #    window is never really presented, so the animation never completes
      #    and the worker is held for the life of the process. They accumulated
      #    to libdispatch's 64-thread soft limit DURING LAUNCH, before the first
      #    test ran — after which any `DispatchQueue.global(...).async` block in
      #    the process might never be scheduled at all. That is what parked
      #    `MCPServerLifecycleTests` and killed whole gates.
      # 2. It also meant the test host was reopening whatever project windows
      #    the developer happened to have had open — a hidden dependency on
      #    machine state that no test asks for and none should have.
      #
      # Measured on `DiagnosticsPaneTests` (72 tests, the heaviest mounting
      # suite): 74 threads peak / 51-63 blocked in `-[NSAnimation _runBlocking]`
      # / soft limit reached, versus 46 / 3 / not reached with this set. Same 75
      # tests pass either way.
      commandLineArguments:
        "-ApplePersistenceIgnoreState YES": true
      targets:
        # parallelizable: tests run across multiple hosted app processes.
        # Measured 2026-08-08: full suite 7.6 → 2.75 min wall, 4,313 passed /
        # 0 failed on the first parallel run. Each worker is its own app
        # process, so window-mount and key-window tests don't collide.
        - name: MaughamTests
          parallelizable: true
  MaughamPhone:
    build:
      targets:
        MaughamPhone: all
        MaughamPhoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MaughamPhoneTests
