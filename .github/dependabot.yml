version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows/ current. Dependabot
  # follows the version comment next to each pin and bumps both the SHA and
  # the comment when a new release lands.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # Roll routine action bumps into one PR/week instead of one per action.
    groups:
      actions:
        update-types:
          - minor
          - patch
