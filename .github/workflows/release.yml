name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    # macos-15 (or newer) gives access to Xcode 17.x + the macOS 26 SDK,
    # which is what the developer machine uses. SwiftUI's selection-state
    # styling differs between SDKs (the macOS 26 SDK renders the "Liquid
    # Glass" idiom; older SDKs render flatter), so matching SDKs matters.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # CFBundleVersion is now `git rev-list --count HEAD` (see the Extract
          # step), which needs the full history. The default shallow clone
          # (fetch-depth: 1) would make every build number 1. fetch-depth: 0 = full.
          fetch-depth: 0
          # This job loads Developer ID signing + notarization secrets and never
          # pushes back to git, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Set up Xcode 26.3
        # Pinned (NOT latest-stable) so an unexpected Xcode bump on the runner
        # can't silently change the toolchain between releases. 26.3 is the newest
        # Xcode the macos-15 runner has installed (26.5/26.6 exist only on the
        # developer machine — pinning those would fail the runner; commit a20e0da).
        # Matches ci.yml so CI and release build with the same toolchain.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'

      - name: Print Xcode + SDK info
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk macosx
          xcrun --show-sdk-version --sdk macosx

      - name: Install xcodegen (pinned 2.45.4, checksum-verified)
        # Pin xcodegen to a specific released binary instead of `brew install
        # xcodegen` (which floats to whatever the tap currently ships). Download
        # the official XcodeGen release asset, verify its sha256, then install the
        # bin/ + share/ layout (the binary resolves its SettingPresets from
        # ../share). xcodegen.zip ships a universal (x86_64 + arm64) binary, so it
        # runs on any macos-runner arch. Verified end-to-end locally (checksum gate
        # + `xcodegen generate`); see docs/RELEASING.md.
        # NB: `brew install --formula <url>` is NOT valid on modern Homebrew —
        # formulae must live in a tap — hence this direct pinned download.
        # To bump: change XCODEGEN_VERSION + XCODEGEN_SHA256 (sha256 of the
        # xcodegen.zip asset from that GitHub release).
        run: |
          set -euo pipefail
          XCODEGEN_VERSION=2.45.4
          XCODEGEN_SHA256=090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          PREFIX="$RUNNER_TEMP/xcodegen"
          mkdir -p "$PREFIX"
          cp -R "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin"   "$PREFIX/"
          cp -R "$RUNNER_TEMP/xcodegen-dist/xcodegen/share" "$PREFIX/"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/xcodegen" --version

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERT }}
          p12-password: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}

      - name: Decode App Store Connect API key (for notarytool)
        env:
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/asc
          printf '%s' "$ASC_API_KEY" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Extract version + build number from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # CFBundleVersion = commit count: deterministic, tied to git history, and
          # strictly monotonic across releases (mirrors phone-release.yml). Replaces
          # github.run_number, which is CI bookkeeping — not reproducible from source
          # and reset to 1 if the workflow file is ever renamed. Needs full history
          # (fetch-depth: 0); a shallow clone would make every build number 1.
          BUILD="$(git rev-list --count HEAD)"
          if [[ "$BUILD" -le 1 ]]; then
            echo "::error::build number is $BUILD — history looks shallow (need fetch-depth: 0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing Maugham $VERSION ($BUILD)"

      - name: Classify release (stable vs dry-run prerelease)
        id: channel
        # Patch number >= 90 is the reserved DRY-RUN band (e.g. v0.5.90). Such
        # builds are throwaway signing/notarization shakedowns and MUST be marked
        # prerelease so the stable channel's /releases/latest poll (which excludes
        # prereleases) never surfaces them to installed users. Real releases use
        # normal patch numbers (0, 1, 2, …) and publish as stable. This makes the
        # safety structural — not a manual post-publish flip that could race.
        run: |
          set -euo pipefail
          PATCH="${GITHUB_REF_NAME##*.}"
          if [[ "$PATCH" -ge 90 ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Dry-run band (patch $PATCH >= 90) → prerelease"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Stable release (patch $PATCH) → not prerelease"
          fi

      - name: Verify release notes exist
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NOTES="docs/release-notes/v${VERSION}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "::error::Missing $NOTES"
            exit 1
          fi
          echo "Release notes: $NOTES"

      - name: Sync version into project.yml (Maugham target only)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          # The Mac (Maugham) and Phone (MaughamPhone) targets carry byte-identical
          # placeholders — CFBundleShortVersionString "0.0.0-dev" / CFBundleVersion
          # "1" — so an unscoped sed rewrites BOTH. Scope each substitution to the
          # `Maugham:` target block (from its 2-space key up to the `MaughamPhone:`
          # key) so the phone placeholders stay at their defaults. macOS sed needs -i ''.
          sed -i '' \
            "/^  Maugham:$/,/^  MaughamPhone:$/ s/CFBundleShortVersionString: \"0.0.0-dev\"/CFBundleShortVersionString: \"${VERSION}\"/" \
            project.yml
          sed -i '' \
            "/^  Maugham:$/,/^  MaughamPhone:$/ s/CFBundleVersion: \"1\"/CFBundleVersion: \"${BUILD}\"/" \
            project.yml
          grep -nE "CFBundleShortVersionString|CFBundleVersion" project.yml

      - name: Generate project
        run: ./gen.sh

      - name: Derive Team ID from imported cert
        id: team
        run: |
          set -euo pipefail
          TEAM=$(security find-identity -v -p codesigning | \
            grep "Developer ID Application" | head -1 | \
            sed -E 's/.*\(([A-Z0-9]+)\)"?$/\1/')
          if [[ -z "$TEAM" ]]; then echo "::error::no Developer ID Application identity found"; exit 1; fi
          echo "team_id=$TEAM" >> "$GITHUB_OUTPUT"
          echo "Team: $TEAM"

      - name: Build (Release, signed + hardened)
        env:
          TEAM_ID: ${{ steps.team.outputs.team_id }}
        run: |
          xcodebuild -project Maugham.xcodeproj -scheme Maugham \
            -configuration Release build \
            DEVELOPMENT_TEAM="${TEAM_ID}"

      - name: Test
        # Tests run in Debug — the scheme's Test action only builds the test
        # target in Debug. The Release build step above already verifies the
        # Release-config code path compiles cleanly.
        run: |
          xcodebuild -project Maugham.xcodeproj -scheme Maugham \
            test CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult

      - name: Locate built app
        id: locate
        run: |
          APP_PATH=$(xcodebuild -project Maugham.xcodeproj -scheme Maugham \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk -F'= ' '/^[[:space:]]*BUILT_PRODUCTS_DIR/ { print $2 }' \
            | head -1)/Maugham.app
          echo "Located: $APP_PATH"
          test -d "$APP_PATH" || { echo "::error::App not found at $APP_PATH"; exit 1; }
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Re-sign nested executables (inside-out, hardened)
        env:
          APP: ${{ steps.locate.outputs.app_path }}
        run: |
          set -euo pipefail
          IDENTITY="Developer ID Application"
          OPTS="--force --options runtime --timestamp --sign"
          # Sign the bundled tectonic binary (ships via a type:folder reference,
          # so Xcode's build does not re-sign it — notarytool would reject it).
          TECTONIC="$APP/Contents/Resources/bin/tectonic"
          if [[ -f "$TECTONIC" ]]; then
            codesign $OPTS "$IDENTITY" "$TECTONIC"
          fi
          # Defensively re-sign the embedded MCP tool (deepest-first ordering).
          MCP="$APP/Contents/MacOS/maugham-mcp"
          if [[ -f "$MCP" ]]; then
            codesign $OPTS "$IDENTITY" "$MCP"
          fi
          # Re-sign the outer app LAST so its seal covers the freshly-signed
          # nested code. (Xcode already signed it once; this re-seals with the
          # entitlements + hardened runtime intact.)
          codesign $OPTS "$IDENTITY" --entitlements Maugham/Maugham.entitlements "$APP"
          # Verify the whole thing is internally consistent before we notarize.
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize + staple
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP: ${{ steps.locate.outputs.app_path }}
        run: |
          set -euo pipefail
          KEY="/tmp/asc/AuthKey_${ASC_KEY_ID}.p8"
          AUTH=(--key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          # notarytool needs a zip of the app to submit.
          ditto -c -k --keepParent "$APP" /tmp/notarize.zip

          # We deliberately do NOT use `submit --wait`: Apple's scan can take 15+
          # minutes, and a single dropped connection mid-wait (a real GitHub-runner
          # failure mode — NSURLErrorNotConnectedToInternet) fails the whole release
          # AND loses the submission id. Instead: submit once (capture the id), then
          # poll with our own loop that TOLERATES transient network errors and only
          # gives up on an explicit Apple verdict or an overall timeout.
          echo "Submitting to notarization service…"
          SUBMIT_OUT=$(xcrun notarytool submit /tmp/notarize.zip "${AUTH[@]}")
          echo "$SUBMIT_OUT"
          SUB_ID=$(echo "$SUBMIT_OUT" | awk '/^[[:space:]]*id:/ { print $2; exit }')
          if [[ -z "$SUB_ID" ]]; then
            echo "::error::could not parse submission id from notarytool output"
            exit 1
          fi
          echo "Submission id: $SUB_ID"

          # Poll up to 30 minutes. A failed `info` call (network blip) is retried,
          # not fatal. Only an Apple verdict of Accepted/Invalid/Rejected ends it.
          DEADLINE=$(( SECONDS + 1800 ))
          STATUS="In Progress"
          while [[ "$SECONDS" -lt "$DEADLINE" ]]; do
            if INFO=$(xcrun notarytool info "$SUB_ID" "${AUTH[@]}" 2>/tmp/notary.err); then
              STATUS=$(echo "$INFO" | sed -nE 's/^[[:space:]]*status:[[:space:]]*//p')
              echo "status: $STATUS"
              case "$STATUS" in
                Accepted) break ;;
                "In Progress") sleep 30 ;;
                *)
                  echo "::error::notarization status: $STATUS"
                  xcrun notarytool log "$SUB_ID" "${AUTH[@]}" || true
                  exit 1 ;;
              esac
            else
              echo "transient notarytool info error (will retry):"
              cat /tmp/notary.err || true
              sleep 30
            fi
          done
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::error::notarization did not reach Accepted within timeout (last: $STATUS)"
            echo "Submission $SUB_ID is still valid — re-run can resume via notarytool info/log."
            exit 1
          fi

          xcrun stapler staple "$APP"
          # Gate: assessment + signature must pass or we don't ship.
          spctl -a -t exec -vv "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package .dmg and .zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          APP: ${{ steps.locate.outputs.app_path }}
        run: |
          set -euo pipefail
          # DMG (manual / website download)
          mkdir -p /tmp/dmg-root
          ditto "$APP" "/tmp/dmg-root/Maugham.app"
          ln -s /Applications /tmp/dmg-root/Applications
          hdiutil create -volname Maugham -srcfolder /tmp/dmg-root -ov -format UDZO \
            "Maugham-${VERSION}.dmg"
          # ZIP (in-app auto-update payload; staple ticket travels inside the bundle)
          ditto -c -k --keepParent "$APP" "Maugham-${VERSION}.zip"
          ls -lh "Maugham-${VERSION}.dmg" "Maugham-${VERSION}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            Maugham-${{ steps.ver.outputs.version }}.dmg
            Maugham-${{ steps.ver.outputs.version }}.zip
          body_path: docs/release-notes/v${{ steps.ver.outputs.version }}.md
          name: Maugham ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
