name: CI

# Runs the Mac and iPhone test suites on every push / PR to main and claude/**
# branches. Does NOT trigger on tags — release.yml and phone-release.yml own
# tag-triggered builds and will continue to run their own test step.
#
# NOTE: This workflow intentionally reports failures. Tasks 0.2 / 0.3 of the
# codebase-hardening plan add correctness tests that are RED against unfixed
# code by design — they are the spec for Milestone 1 fixes. Do not add
# allow-failure logic to hide them.

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
      - 'claude/**'

# No write permissions needed — this workflow only reads code and reports test
# results. The principle of least privilege also limits blast radius if a
# third-party action is ever compromised.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR so a fast follow-up push
# doesn't queue behind a now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Mac scheme test suite
  # ---------------------------------------------------------------------------
  mac-tests:
    name: Mac tests (Maugham scheme)
    # macos-26 (image is macOS 26.5.2) — the app's deployment target is macOS
    # 26, so it cannot launch on macos-15 at all. It also ends a real gap: the
    # runner used to be two majors behind the only machine anyone develops or
    # ships on, and AppKit/SwiftUI layout differs enough between them that
    # mounted-view tests measured on 26.5 failed here and nowhere else.
    runs-on: macos-26
    # Recent green runs finish in ~7 min; 30 caps a hung simulator/process well
    # below the 6 h GitHub default (which would burn macOS-runner minutes).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes back to git, so don't leave the token in
          # .git/config (env-block injection defence, per CI-hardening notes).
          persist-credentials: false

      - name: Set up Xcode 26.6
        # Pinned to a specific version (NOT latest-stable) so an unexpected
        # Xcode bump can't silently break the gate between releases. The pin is
        # 26.6 because that is what the developer machine runs (verified with
        # `xcodebuild -version`, 2026-08-04) — the macos-26 image carries 26.0.1
        # through 26.6, so matching the dev toolchain is finally possible; it was
        # not on macos-15, which topped out at 26.3 (see commit a20e0da, now
        # superseded). SHA is the canonical commit for setup-xcode v1.7.0.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Print Xcode + SDK info
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk macosx
          xcrun --show-sdk-version --sdk macosx

      - name: Install the Metal toolchain
        # Xcode 26 unbundles the Metal compiler into a downloadable component.
        # Without it, CompileMetalFile fails with "cannot execute tool 'metal'
        # due to missing Metal Toolchain" the moment anything builds
        # Maugham/Canvas/CanvasGround.metal — the canvas ground shader, and the
        # repo's only .metal file. That surfaces as a *build* error in commits
        # containing no Swift change, which is a confusing thing to debug cold.
        # No-op when the component is already in the runner image.
        # Deliberately non-fatal: if the component is genuinely missing AND this
        # download fails, the build step below reports it with the real error
        # rather than this one masking it.
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Install xcodegen (pinned 2.45.4, checksum-verified)
        # Pinned to a specific released binary (not `brew install xcodegen`, which
        # floats). Download the official xcodegen.zip, verify its sha256, install
        # bin/ + share/. Universal (x86_64 + arm64) binary. Same mechanism/pin as
        # the release workflows so CI and release share one toolchain; because CI
        # runs on every push, it exercises this exact install line for real.
        # NB: `brew install --formula <url>` is NOT valid on modern Homebrew —
        # formulae must live in a tap — hence this direct pinned download.
        # To bump: change XCODEGEN_VERSION + XCODEGEN_SHA256 (sha256 of xcodegen.zip).
        run: |
          set -euo pipefail
          XCODEGEN_VERSION=2.45.4
          XCODEGEN_SHA256=090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          PREFIX="$RUNNER_TEMP/xcodegen"
          mkdir -p "$PREFIX"
          cp -R "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin"   "$PREFIX/"
          cp -R "$RUNNER_TEMP/xcodegen-dist/xcodegen/share" "$PREFIX/"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/xcodegen" --version

      - name: Generate project
        # Maugham.xcodeproj is generated (gitignored). Always run gen.sh before
        # any xcodebuild invocation.
        run: ./gen.sh

      - name: Cache SPM dependencies
        # Cache the resolved Swift Package sources (WhisperKit is the big one) so
        # every run doesn't re-fetch them. SourcePackages only — NOT build
        # products, which would risk staleness across Xcode/toolchain changes.
        # Key on the tracked dependency-source files: project.yml carries the
        # pinned WhisperKit revision and MaughamCore's Package.swift its deps.
        # (Package.resolved lives under the generated .xcodeproj and isn't
        # tracked, so it can't anchor the key.) SHA-pinned like every action here
        # (actions/cache v6.1.0).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/MaughamCore/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Restore the tectonic TeX bundle cache
        # WHY THIS EXISTS (run 31874029028, 2026-08-15): the PDF half of the
        # publish suite shells out to the bundled `tectonic`, which fetches its
        # TeX Live bundle from a THIRD-PARTY host
        # (relay.fullyjustified.net -> data1.fullyjustified.net) on a cold
        # cache. Nothing cached that fetch, so every CI run did it cold — and
        # when it failed partway, `PublishingEndToEndTests` went red with
        # `status: failed` and an empty `errors` array (no LaTeX error at all;
        # the process died mid-download). The same run then re-fetched
        # successfully 8.3s later in another suite, which is what a transient
        # network failure looks like from the inside.
        #
        # A cache hit removes the network from the common path entirely and
        # takes ~12s off the gate. Keyed on scripts/fetch-tectonic.sh because
        # that file pins the tectonic VERSION, and the version chooses which
        # bundle URL/format is fetched — bump the pin, mint a new cache.
        #
        # Restore/save are SPLIT (rather than one `actions/cache` step) so the
        # save still runs when the suite goes red: a failing gate is exactly
        # when the warm bundle is most worth keeping, and the combined action
        # only saves on success. Same action SHA as the SPM cache above.
        id: tectonic-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Debug builds are the `dev` BuildVariant, so the tests write to
          # "Maugham Dev"; the stable path is listed too so this keeps working
          # if the gate ever runs a Release configuration. A path that does not
          # exist is skipped, not an error. See TectonicCache.cacheURL().
          path: |
            ~/Library/Caches/Maugham Dev/tectonic
            ~/Library/Caches/Maugham/tectonic
          key: tectonic-bundle-${{ runner.os }}-${{ hashFiles('scripts/fetch-tectonic.sh') }}
          restore-keys: |
            tectonic-bundle-${{ runner.os }}-

      - name: Run Mac tests
        # The click-driving suites (TreeTravelTests) need the test host to be
        # the ACTIVE app, and activation is opt-in (`TestWindow.activate`)
        # because a local gate must never take the developer's keyboard. The
        # runner has no developer, so CI opts in. Locally they usually click anyway
        # on the inactive accessory host (measured 2026-08-27) and skip by name only
        # where the click measurably fails, e.g. a locked screen.
        env:
          TEST_RUNNER_MAUGHAM_ALLOW_ACTIVATION: "1"
        run: |
          xcodebuild \
            -project Maugham.xcodeproj \
            -scheme Maugham \
            test \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults-Mac.xcresult

      - name: Save the tectonic TeX bundle cache
        # `always()` so a red gate still seeds the cache for the next run — see
        # the restore step's note. Non-fatal: a "cache already exists" on an
        # exact key hit is the normal steady state, not a failure.
        if: always() && steps.tectonic-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/Maugham Dev/tectonic
            ~/Library/Caches/Maugham/tectonic
          key: tectonic-bundle-${{ runner.os }}-${{ hashFiles('scripts/fetch-tectonic.sh') }}

      - name: Upload Mac test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults-Mac
          path: TestResults-Mac.xcresult
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 2 — Phone scheme test suite (iOS Simulator)
  # ---------------------------------------------------------------------------
  phone-tests:
    name: Phone tests (MaughamPhone scheme)
    runs-on: macos-15
    # 30 min: room for the documented one simulator-boot retry without ever
    # approaching the 6 h GitHub default on a hung sim.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode 26.3
        # 26.3 = newest Xcode on the macos-15 runner (26.5 is dev-machine-only;
        # pinning it would fail the runner — commit a20e0da).
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'

      - name: Print Xcode + SDK info
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphonesimulator
          xcrun --show-sdk-version --sdk iphonesimulator

      - name: Install xcodegen (pinned 2.45.4, checksum-verified)
        # Pinned to a specific released binary (not `brew install xcodegen`, which
        # floats). Download the official xcodegen.zip, verify its sha256, install
        # bin/ + share/. Universal (x86_64 + arm64) binary. Same mechanism/pin as
        # the release workflows so CI and release share one toolchain; because CI
        # runs on every push, it exercises this exact install line for real.
        # NB: `brew install --formula <url>` is NOT valid on modern Homebrew —
        # formulae must live in a tap — hence this direct pinned download.
        # To bump: change XCODEGEN_VERSION + XCODEGEN_SHA256 (sha256 of xcodegen.zip).
        run: |
          set -euo pipefail
          XCODEGEN_VERSION=2.45.4
          XCODEGEN_SHA256=090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          PREFIX="$RUNNER_TEMP/xcodegen"
          mkdir -p "$PREFIX"
          cp -R "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin"   "$PREFIX/"
          cp -R "$RUNNER_TEMP/xcodegen-dist/xcodegen/share" "$PREFIX/"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/xcodegen" --version

      - name: Generate project
        run: ./gen.sh

      - name: Cache SPM dependencies
        # SourcePackages only (see the Mac job for rationale). SHA-pinned
        # actions/cache v6.1.0.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/MaughamCore/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run Phone tests (with one retry for sim flakiness)
        # The iOS simulator can fail with "Busy / failed preflight checks" on
        # the first boot — CLAUDE.md documents this as a flake that resolves on
        # retry. A single retry is sufficient; `simctl shutdown all` is NOT done
        # here because (per CLAUDE.md) that command CAUSES the failure.
        #
        # Implementation: run the test command; if it fails, wait 30 s and try
        # once more. A second failure is a real failure and the step exits non-zero.
        #
        # -test-timeouts-enabled + -default-test-execution-time-allowance 120:
        # a hung test (e.g. an unbounded await on a mock signal / AsyncStream that
        # never fires — see the DownloadCoordinator suites) now FAILS at 120 s and
        # names itself, instead of stalling the whole run until the 30-min job
        # timeout. Crucially this converts a hang into a non-zero exit, so the
        # retry above actually fires — the retry only ever caught *failures*, not
        # hangs. (2026-07-01: DownloadCoordinatorBudgetTests hung a PR run 24 min.)
        run: |
          set +e
          xcodebuild \
            -project Maugham.xcodeproj \
            -scheme MaughamPhone \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults-Phone.xcresult
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "First attempt failed (exit $EXIT_CODE). Waiting 30 s before retry..."
            sleep 30
            set -e
            xcodebuild \
              -project Maugham.xcodeproj \
              -scheme MaughamPhone \
              -destination 'platform=iOS Simulator,name=iPhone 17' \
              test \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 120 \
              CODE_SIGNING_ALLOWED=NO \
              -resultBundlePath TestResults-Phone-retry.xcresult
          else
            set -e
          fi

      - name: Upload Phone test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults-Phone
          path: |
            TestResults-Phone.xcresult
            TestResults-Phone-retry.xcresult
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 3 — MaughamCore package tests (swift test, no app host)
  #
  # These 465 tests ran NOWHERE until 2026-08-08: the Maugham scheme's test
  # action only carries MaughamTests, the phone scheme only MaughamPhoneTests,
  # and nothing invoked `swift test`. The package is Apple-frameworks-only, so
  # this job needs no xcodegen, no Metal toolchain and no simulator — the whole
  # parallel run takes ~6 s locally.
  # ---------------------------------------------------------------------------
  core-tests:
    name: MaughamCore package tests (swift test)
    # Pure Foundation/CryptoKit — no UI mounting, so runner-OS drift is not the
    # mounted-view hazard the mac-tests comment describes. Still macos-26 +
    # Xcode 26.6 to keep the toolchain identical to the dev machine's.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode 26.6
        # Same pin as mac-tests; keep the two in step.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Run MaughamCore tests
        run: swift test --parallel --package-path Packages/MaughamCore

  # ---------------------------------------------------------------------------
  # Job 4 — Swift strict-concurrency warning scan
  #
  # Builds with SWIFT_STRICT_CONCURRENCY=complete and prints the warning count.
  # This job NEVER fails on warnings — its sole purpose is to make the count
  # visible in CI logs so the lurking concurrency warnings (the audit predicts
  # they cluster in Maugham/Editor/ AppKit-delegate / Sendable-closure code)
  # become visible incrementally as they're fixed.
  # ---------------------------------------------------------------------------
  behavioural-claims:
    name: Behavioural claims (ExperimentTests)
    # The MaughamCore half of the behavioural-specification claim ledger
    # (register/01-claims-ledger.json): every claim is pinned by a passing
    # test, so this job going red means PINNED BEHAVIOUR CHANGED — check the
    # module's filings in register/reconciliation/ before "fixing" the test;
    # a VIOLATES row is a known defect whose fix must flip its claim + filing
    # in the same commit (see the M4-RW-002 loop). Standalone SPM package,
    # no xcodegen, no Metal, no sim — the cheapest job in this file.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode 26.6
        # Same toolchain pin as mac-tests, for one less axis of drift.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Run the claims suite
        run: swift test --package-path register/ExperimentTests

  # ---------------------------------------------------------------------------
  concurrency-warnings:
    name: Strict-concurrency warning scan
    # Builds the Mac app, so it follows the macOS 26 deployment target.
    runs-on: macos-26
    # Build-only, no sim; 30 min is ample and caps a hung build.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode 26.6
        # 26.6 = the developer machine's Xcode, available on macos-26. Keep this
        # in step with the mac-tests job above.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Install the Metal toolchain
        # See the identical step in mac-tests. This job builds the Maugham scheme
        # too, so it compiles CanvasGround.metal and needs the same component.
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Install xcodegen (pinned 2.45.4, checksum-verified)
        # Pinned to a specific released binary (not `brew install xcodegen`, which
        # floats). Download the official xcodegen.zip, verify its sha256, install
        # bin/ + share/. Universal (x86_64 + arm64) binary. Same mechanism/pin as
        # the release workflows so CI and release share one toolchain; because CI
        # runs on every push, it exercises this exact install line for real.
        # NB: `brew install --formula <url>` is NOT valid on modern Homebrew —
        # formulae must live in a tap — hence this direct pinned download.
        # To bump: change XCODEGEN_VERSION + XCODEGEN_SHA256 (sha256 of xcodegen.zip).
        run: |
          set -euo pipefail
          XCODEGEN_VERSION=2.45.4
          XCODEGEN_SHA256=090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          PREFIX="$RUNNER_TEMP/xcodegen"
          mkdir -p "$PREFIX"
          cp -R "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin"   "$PREFIX/"
          cp -R "$RUNNER_TEMP/xcodegen-dist/xcodegen/share" "$PREFIX/"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/xcodegen" --version

      - name: Generate project
        run: ./gen.sh

      - name: Cache SPM dependencies
        # SourcePackages only (see the Mac job for rationale). SHA-pinned
        # actions/cache v6.1.0.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/MaughamCore/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build with SWIFT_STRICT_CONCURRENCY=complete (warnings only)
        # Build but do NOT test — this step is purely for surfacing diagnostics.
        # Pipe stderr (where xcodebuild emits warnings) through tee so the raw
        # output is visible in the log AND captured to a file for counting.
        # The `|| true` at the end ensures this step never fails the job, even
        # if the build itself exits non-zero due to a concurrency error (which
        # would mean a harder problem, separately caught by the test jobs above).
        run: |
          set -o pipefail
          xcodebuild \
            -project Maugham.xcodeproj \
            -scheme Maugham \
            build \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            2>&1 | tee /tmp/concurrency-build.log || true

      - name: Report concurrency warning count
        # Count lines containing "warning:" that are Sendable/actor/isolation
        # diagnostics specifically, then print the total for tracking over time.
        # Also prints the full per-file breakdown so the worst offenders are
        # visible without downloading an artifact.
        run: |
          TOTAL=$(grep -c "warning:" /tmp/concurrency-build.log 2>/dev/null || echo 0)
          CONCURRENCY=$(grep "warning:" /tmp/concurrency-build.log 2>/dev/null \
            | grep -c -E "Sendable|actor|isolation|concurrent|@MainActor|nonisolated" \
            || echo 0)
          echo "===== Strict-concurrency warning summary ====="
          echo "Total warnings (all kinds): $TOTAL"
          echo "Concurrency-related warnings: $CONCURRENCY"
          echo ""
          echo "--- Per-file concurrency warning counts ---"
          grep "warning:" /tmp/concurrency-build.log 2>/dev/null \
            | grep -E "Sendable|actor|isolation|concurrent|@MainActor|nonisolated" \
            | sed -E 's|.*/([^/]+\.swift):[0-9]+:[0-9]+.*|\1|' \
            | sort | uniq -c | sort -rn \
            || echo "(none found)"
          echo "============================================="
