name: PhoneRelease

on:
  push:
    tags:
      # Phone namespace only. The Mac workflow triggers on 'v[0-9]+...';
      # the two never collide, and milestone-* tags trigger neither.
      - 'phone-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    # iOS archive/sign/export requires a macOS runner. macos-15 matches the Mac
    # workflow (Xcode 17.x + current SDK).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # CRITICAL: the build number is `git rev-list --count HEAD`, which needs
          # the full history. The default shallow clone (fetch-depth: 1) would make
          # every build number 1, and Apple rejects any CFBundleVersion <= a prior
          # upload — so the 2nd cut would be rejected forever. fetch-depth: 0 = full.
          fetch-depth: 0
          # This job loads signing secrets and never pushes back to git (only
          # read-only `git rev-list`), so don't leave the token in .git/config.
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 'latest-stable'

      - name: Print Xcode + SDK info
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos
          xcrun --show-sdk-version --sdk iphoneos

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Extract version + build number
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#phone-v}"
          BUILD="$(git rev-list --count HEAD)"
          # Sanity: a shallow clone would yield BUILD=1. Guard against it.
          if [[ "$BUILD" -le 1 ]]; then
            echo "::error::build number is $BUILD — history looks shallow (need fetch-depth: 0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing MaughamPhone $VERSION ($BUILD)"

      - name: Verify release notes exist
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NOTES="docs/release-notes/phone/v${VERSION}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "::error::Missing $NOTES"
            exit 1
          fi
          echo "Release notes: $NOTES"

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      - name: Install provisioning profile + derive signing identity
        id: prof
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > /tmp/phone.mobileprovision
          # Decode the CMS-wrapped plist to read its UUID / Name / TeamID, then
          # install it under its UUID (the filename Xcode expects).
          security cms -D -i /tmp/phone.mobileprovision > /tmp/phone.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/phone.plist)
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/phone.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/phone.plist)
          cp /tmp/phone.mobileprovision "$PROFILES_DIR/$UUID.mobileprovision"
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "Installed profile '$NAME' ($UUID), team $TEAM_ID"

      - name: Decode App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/asc
          printf '%s' "$ASC_API_KEY" | base64 --decode > "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Sync version + build into project.yml
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          # macOS sed needs -i ''. Each placeholder lives on its own line per target;
          # this rewrites both the Maugham and MaughamPhone declarations, which is
          # harmless — this workflow only archives the MaughamPhone scheme.
          sed -i '' \
            "s/CFBundleShortVersionString: \"0.0.0-dev\"/CFBundleShortVersionString: \"${VERSION}\"/" \
            project.yml
          sed -i '' \
            "s/CFBundleVersion: \"1\"/CFBundleVersion: \"${BUILD}\"/" \
            project.yml
          grep -E "CFBundleShortVersionString|CFBundleVersion" project.yml

      - name: Generate project
        run: ./gen.sh

      - name: Archive (Release, generic iOS)
        env:
          TEAM_ID: ${{ steps.prof.outputs.team_id }}
          PROFILE_NAME: ${{ steps.prof.outputs.name }}
        run: |
          set -euo pipefail
          xcodebuild -project Maugham.xcodeproj -scheme MaughamPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MaughamPhone.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}"

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ steps.prof.outputs.team_id }}
          PROFILE_NAME: ${{ steps.prof.outputs.name }}
        run: |
          set -euo pipefail
          # Generated at runtime so no account-specific values (team id, profile
          # name) are committed. destination=upload makes xcodebuild itself send the
          # build to App Store Connect during export — no altool (deprecated and
          # silently broken on Xcode 26: fastlane#29743). method=app-store-connect
          # (the old "app-store" value is deprecated).
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <!-- Capital "M": matches the registered App ID com.Maugham.MaughamPhone.
                   Codesign matches the bundle id case-sensitively, so this MUST equal
                   the Release PRODUCT_BUNDLE_IDENTIFIER in project.yml exactly. -->
              <key>com.Maugham.MaughamPhone</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          cat build/ExportOptions.plist

      - name: Export + upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # With destination=upload in the plist, -exportArchive uploads to App Store
          # Connect using the API key passed below. The same key satisfies any
          # provisioning lookups (-allowProvisioningUpdates).
          xcodebuild -exportArchive \
            -archivePath build/MaughamPhone.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "/tmp/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload .ipa as workflow artifact
        # Defense in depth: if the TestFlight upload above fails, the signed .ipa is
        # still retrievable here for a manual upload. (On success, export/ may hold
        # only logs since destination=upload doesn't always emit an .ipa — the glob
        # is best-effort, hence if-no-files-found: ignore.)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MaughamPhone-${{ steps.ver.outputs.version }}-ipa
          path: build/export/*.ipa
          if-no-files-found: ignore

      - name: Create GitHub Release
        # Last step on purpose: TestFlight is the artifact testers consume; the GH
        # release is documentation. A build live on TestFlight without a release page
        # is acceptable; a release page advertising a build that never uploaded is not.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          body_path: docs/release-notes/phone/v${{ steps.ver.outputs.version }}.md
          name: MaughamPhone ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
