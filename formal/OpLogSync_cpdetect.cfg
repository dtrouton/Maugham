\* FINDING 3 — the loss erases its own evidence.
\* Losing a checkpoint removes the pointer whose dangling would have
\* signalled the loss. Expect CheckpointLossIsDetected VIOLATED: a device
\* loses a checkpoint it created and nothing is flagged.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT CheckpointLossIsDetected
CONSTANTS
    Devices = {d1, d2}
    MaxOps = 2
    MaxSeals = 1
    MaxCps = 1
    PerDeviceFiles = TRUE
    PerDeviceCheckpoints = FALSE
    SealHasSuspensionPoint = FALSE
