\* FINDING 1 — the integrity check's false positive.
\* danglingCheckpointPointers calls a dangling pointer "evidence the op log
\* lost ops", and BackupCoordinator skips the backup on it. Expect
\* DanglingMeansLost VIOLATED: a mid-seal remote reader flags a healthy op.
\* Checkpoints are partitioned here so the ONLY cause can be the seal window.
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT LocalNoLoss
INVARIANT DanglingMeansLost
CONSTANTS
    Devices = {d1, d2}
    MaxOps = 2
    MaxSeals = 1
    MaxCps = 1
    PerDeviceFiles = TRUE
    PerDeviceCheckpoints = TRUE
    SealHasSuspensionPoint = FALSE
